[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runtime-sdk"
version = "0.2.0"
description = "AegisVision Python Algorithm Runtime gRPC SDK (layered Contract + Runtime Foundation Services)"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.9.0",
]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
